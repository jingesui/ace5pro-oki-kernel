name: Build Ace5Pro Bazel/kleaf (官方 repo 流程)

# ─────────────────────────────────────────────────────────────────────────
# 官方构建方式（来自 OnePlusOSS/kernel_manifest 分支 oneplus/sm8750 的 README）:
#
#     ./kernel_platform/oplus/build/oplus_build_kernel.sh sun perf
#
# 依赖 33 个仓库（3 个 OnePlusOSS + 30 个 CodeLinaro），由 repo 工具按
# manifest 文件 oneplus_ace5_pro.xml 拉取。
#
# 为什么不能用纯 make：
#   厂商驱动（充电/传感器/设备树，含 848 个充电驱动文件）在
#   android_kernel_modules_and_devicetree_oneplus_sm8750 仓库里，
#   且必须在 kernel_platform 工作区内经 bazel(kleaf) 构建。
#   只克隆 common 仓库用 make 编出的内核缺这些驱动，充电时主电源轨
#   XVDD/DVDD 掉电导致 PMIC 复位（实测 critical.log LOGTYPE=601）。
#
# 平台/variant 取值（源码审计确认）：
#   $1 platform : sun        （sm8750 的高通代号；oplus_setup.sh 里只认 sun）
#   $2 variant  : perf       （=user；consolidate=userdebug）
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        type: choice
        options: ['perf', 'consolidate']
        default: 'perf'
      repo_jobs:
        description: 'repo 并发数（默认 2，过高易触发 Gitaly 过载）'
        type: string
        default: '2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MANIFEST_URL: https://github.com/OnePlusOSS/kernel_manifest
      MANIFEST_BRANCH: oneplus/sm8750
      MANIFEST_FILE: oneplus_ace5_pro.xml
      PLATFORM: sun
      VARIANT: ${{ inputs.variant }}
      REPO_JOBS: ${{ inputs.repo_jobs }}

    steps:
      - name: 清理磁盘 + 显示资源
        run: |
          # 磁盘是本方案最大风险：repo sync 需 ~7 GiB，bazel 产物可能 10+ GiB，
          # 而 ubuntu-latest 清理后约 25 GiB。尽可能腾空。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache /usr/local/lib/node_modules \
            /opt/az /usr/local/share/powershell /usr/share/swift \
            /opt/google /usr/lib/jvm /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/chromium /usr/share/miniconda /opt/conda 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb 2>/dev/null || true
          echo "=== 磁盘 ==="; df -h /
          AVAIL=$(df -BG / | awk 'NR==2{gsub("G","",$4); print $4}')
          echo "  可用: ${AVAIL} GiB（需 >= 20 才安全）"
          if [ "${AVAIL:-0}" -lt 20 ]; then
            echo "::warning::可用空间仅 ${AVAIL} GiB，可能不足以完成构建"
          fi
          echo "=== 内存 ==="; free -h
          echo "=== CPU ==="; nproc

      - name: 设置 SWAP（Bazel 链接阶段内存峰值很高）
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l 16G /swapfile 2>/dev/null; then
            sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show; free -h
          SW=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${SW:-0}" -lt 1000 ]; then echo "::error::swap 未生效"; exit 1; fi

      - name: 安装依赖（含 repo 工具）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev python3 cpio dwarves \
            zip unzip curl git patch rsync build-essential \
            openjdk-17-jdk-headless 2>&1 | tail -3
          echo "=== git / java ==="
          git --version
          java -version 2>&1 | head -2

          echo "=== 安装 repo ==="
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo" \
          || curl -fsSL --retry 3 \
            https://github.com/GerritCodeReview/git-repo/raw/main/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

          # ── 禁止内网缓存（源码审计 §7.4）──
          # 若设了这两个变量，bazel 会去连内网 bazel-remote-cache.myoas.com:9093，
          # CI 上必然失败。显式清空并写入 GITHUB_ENV，确保后续步骤也不带。
          unset OPLUS_USE_JFROG_CACHE OPLUS_USE_BUILDBUDDY_REMOTE_BUILD
          {
            echo "OPLUS_USE_JFROG_CACHE="
            echo "OPLUS_USE_BUILDBUDDY_REMOTE_BUILD="
          } >> "$GITHUB_ENV"
          echo "  已清空内网缓存变量"

          # JDK：manifest 拉的是 jdk11，但 oplus_setup.sh 把 JAVA_HOME 指到不存在的
          # jdk21 路径。审计确认主链无代码读它，但为保险起见指向真实存在的 jdk11。
          if [ -d kernel_platform/prebuilts/jdk/jdk11 ]; then
            echo "  JDK11 存在: $(ls kernel_platform/prebuilts/jdk/jdk11)"
          else
            echo "  [WARN] kernel_platform/prebuilts/jdk/jdk11 不存在（sync 尚未执行，属正常）"
          fi

      - name: 取出仓库脚本（inject_clone_depth.py 等）
        uses: actions/checkout@v4
        with:
          path: repo

      - name: repo init（官方 manifest）
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"
          git config --global user.name  "CI"
          git config --global user.email "ci@example.com"
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

          echo "=== repo init -b $MANIFEST_BRANCH -m $MANIFEST_FILE ==="
          repo init \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            -m "$MANIFEST_FILE" \
            --no-clone-bundle --no-tags
          echo "=== manifest 已拉取，项目数: ==="
          ls .repo/manifests/ | head
          grep -c "<project" .repo/manifests/$MANIFEST_FILE

      - name: repo sync（33 个仓库，浅克隆后约 3.9 GB 工作树）
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/src"
          # CodeLinaro 偶发 HTTP 500（实测：同一 URL 间歇性失败，重试即恢复）
          # 因此给 sync 加多轮重试；repo sync 本身幂等（可续传）
          echo "=== CodeLinaro 连通性预检 ==="
          for u in \
            https://git.codelinaro.org/clo/la/kernelplatform/prebuilts-master/clang/host/linux-x86 \
            https://git.codelinaro.org/clo/la/kernel_platform/external/dtc \
          ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$u" || echo 000)
            echo "  $code  $u"
          done
          echo "（500/000 属已知偶发，靠重试解决，不中止）"

                    # ─────────────────────────────────────────────────────────
          # 浅克隆：repo sync 【没有】 --depth 参数（实测报错：
          #   main.py: error: no such option: --depth）。
          #
          # 而且 clone-depth 只能写在 <project> 上，不能写在 <default> 上！
          #   manifest_xml.py:1963 在 _ParseProject() 里读它；
          #   _Default 类的属性列表里根本没有 clone_depth。
          # 上一轮注入到 <default> → 静默无效 → repo 拉全历史 25.9 GiB
          # → 磁盘写满 → System.IO.IOException: No space left on device。
          #
          # 正确做法：给【每个 <project>】注入 clone-depth="1"。
          # 官方 manifest 不带它 = 全量克隆，25 GB runner 必爆盘；
          # 浅克隆后工作树约 3.9 GiB。
          # ─────────────────────────────────────────────────────────
          MF=".repo/manifests/$MANIFEST_FILE"
          echo "=== 给每个 <project> 注入 clone-depth=1 ==="
          cp "$MF" "$MF.orig"
          # 用仓库里的脚本注入（避免在 YAML 里嵌套 heredoc）
          INJECT="$GITHUB_WORKSPACE/repo/tools/inject_clone_depth.py"
          if [ ! -f "$INJECT" ]; then
            echo "::error::缺少 $INJECT（需先 checkout 仓库）"
            exit 1
          fi
          python3 "$INJECT" "$MF"
          echo "=== 校验：注入数量应等于 project 数 ==="
          NP=$(grep -c '<project' "$MF")
          ND=$(grep -c 'clone-depth' "$MF")
          echo "  project=$NP  clone-depth=$ND"
          if [ "$ND" -lt "$NP" ]; then
            echo "::error::clone-depth 注入不完整（$ND/$NP），会导致全量克隆爆盘"
            exit 1
          fi
          python3 -c "import xml.etree.ElementTree as ET,sys; ET.parse(sys.argv[1]); print('  XML 合法')" "$MF" \
            || { echo "::error::注入后 manifest XML 非法"; exit 1; }
          MF=".repo/manifests/$MANIFEST_FILE"
          echo "=== 给 manifest 注入 clone-depth=1 ==="
          cp "$MF" "$MF.orig"
          if grep -q 'clone-depth' "$MF"; then
            echo "  manifest 已含 clone-depth，跳过"
          else
            sed -i 's|<default \([^>]*\)/>|<default \1 clone-depth="1" />|' "$MF"
            grep -q 'clone-depth' "$MF" \
              || { echo "  [WARN] sed 未命中，尝试匹配多行 default"; }
          fi
          echo "=== 修改后的 default 行 ==="
          grep -o '<default[^>]*>' "$MF" | head -2

          # 并发降到 2：Gitaly 过载是上次失败的直接原因之一，降并发更稳
          # （浅克隆本身已大幅降低单仓请求量，双重保险）
          REPO_JOBS=2

          # CodeLinaro 的 Gitaly 后端会间歇性不可用：
          #   remote: The git server, Gitaly, is not available at this time.
          # 属服务端问题，只能退避重试。repo sync 可续传，已下载的不重下。
          sync_try() {
            echo "=== repo sync -c -j$REPO_JOBS --no-tags --force-sync --no-clone-bundle ==="
            timeout 3000 repo sync -c -j"$REPO_JOBS" --no-tags --force-sync \
              --no-clone-bundle 2>&1 | tail -80
            return ${PIPESTATUS[0]}
          }

          OK=0
          for attempt in 1 2 3 4 5; do
            WAIT=$(( attempt * 30 ))
            echo "=== repo sync 第 $attempt/5 轮（失败则等 ${WAIT}s 重试）==="
            if sync_try; then OK=1; break; fi
            echo "::warning::第 $attempt 轮失败（Gitaly 服务端不可用或网络抖动）"
            if [ "$attempt" -lt 5 ]; then
              echo "等待 ${WAIT} 秒后重试（可续传）"
              sleep "$WAIT"
            fi
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::repo sync 五轮均失败"
            exit 1
          fi
          echo "=== repo sync 成功 ==="

          echo "=== sync 后磁盘 ==="; df -h / | tail -1
          echo "=== 顶层内容 ==="; ls -la | head -20
          # 注意：不要删各仓库的 .git！
          # bazel 构建时会调 `repo manifest -r`，它需要读每个
          # 仓库的 git 元数据（rev-parse HEAD）。删了 .git 会报：
          #   GitCommandError: 'rev-parse --verify --quiet HEAD^{commit}' failed
          #   fatal: not a git repository
          #   ERROR: Failed to restore headers from symlinks  → 构建失败
          # 实测磁盘余量充足（浅克隆后 .repo 仅 3.6 GB），无需疦身。
          echo "=== 磁盘状态（保留 .git 以供 repo manifest -r 使用）==="
          df -h / | tail -1
          du -sh .repo 2>/dev/null | sed 's/^/  .repo: /'
          echo "=== 清理后磁盘 ==="; df -h / | tail -1

      - name: 校验工作区完整性（缺一个就编不出可用内核）
        run: |
          cd "$GITHUB_WORKSPACE/src"
          FAIL=0
          check() {
            if [ -e "$1" ]; then echo "  [OK]   $1"; else echo "  [FAIL] $1"; FAIL=1; fi
          }
          echo "=== 3 个 OnePlusOSS 仓库 ==="
          check kernel_platform/common/Makefile
          check kernel_platform/msm-kernel/BUILD.bazel
          check vendor/oplus/kernel/charger/Makefile
          check kernel_platform/oplus/build/oplus_build_kernel.sh
          echo "=== linkfile（manifest 声明，repo 会自动建）==="
          check kernel_platform/.source_date_epoch_dir
          check kernel_platform/build_with_bazel.py
          check kernel_platform/build/prebuilts/build-tools
          echo "=== 关键 prebuilts ==="
          check kernel_platform/prebuilts/build-tools
          check kernel_platform/prebuilts/clang-tools
          check kernel_platform/prebuilts/jdk/jdk11
          check kernel_platform/tools/mkbootimg
          check kernel_platform/build/kernel/kleaf
          echo "=== 厂商驱动规模（应 >800 个 .c）==="
          cchg=$(find vendor/oplus/kernel/charger -name '*.c' 2>/dev/null | wc -l)
          cdts=$(find kernel_platform/qcom/opensource/devicetree -name '*.dts*' 2>/dev/null | wc -l)
          echo "  charger .c 文件数: $cchg"
          echo "  设备树文件数:      $cdts"
          [ "$cchg" -lt 100 ] && { echo "  [FAIL] 充电驱动文件过少，vendor 树没拉全"; FAIL=1; }

          echo "=== prepare_vendor.sh 的硬性前置条件（审计发现）==="
          # ① linkfile 必须真实存在（repo 会按 manifest 建，这里复核）
          for lf in kernel_platform/.source_date_epoch_dir \
                    kernel_platform/build_with_bazel.py ; do
            if [ -e "$lf" ]; then echo "  [OK]   linkfile $lf"; else echo "  [FAIL] linkfile $lf 缺失"; FAIL=1; fi
          done
          # ② kernel_platform 必须位于 <root>/kernel_platform
          #    （prepare_vendor.sh:508-514 会断言 ANDROID_TO_KP == "kernel_platform"）
          [ -d kernel_platform ] && echo "  [OK]   <root>/kernel_platform 结构正确" \
            || { echo "  [FAIL] kernel_platform 不在根下"; FAIL=1; }
          # ③ bionic/libc/kernel/uapi 必须存在（prepare_vendor.sh:555-559 传给 export_headers.py）
          #    AOSP 树里才有真的；CI 里造一个空的。缺失会导致 UAPI 头导出结果错误
          #    （所有 kernel 头被判为 MSM specific 而全量导出），不致命但影响正确性。
          if [ ! -d bionic/libc/kernel/uapi ]; then
            mkdir -p bionic/libc/kernel/uapi
            echo "  [INFO] 已创建占位 bionic/libc/kernel/uapi（审计 §7.6 ③）"
          else
            echo "  [OK]   bionic/libc/kernel/uapi 存在"
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::工作区不完整，中止以免编出半成品"
            exit 1
          fi
          echo "工作区校验通过 ✅"

      - name: 打补丁 + 注入配置（风驰 HMBIRD / Droidspaces / ADIOS）
        run: |
          set -e
          # ───────────────────────────────────────────────────────────────
          # 全部逻辑放在仓库脚本 tools/ci_patch_and_config.sh 里，workflow
          # 只负责调用 —— 避免 YAML 转义地狱。
          # 历史教训：嵌套 heredoc 放第 0 列会让 yaml.scanner 报
          #          ScannerError；echo 里的多余引号会导致 bash 语法错误。
          #
          # 补丁作用于 kernel_platform/msm-kernel（【不是】common）—— 铁证：
          #   ① run#4 内嵌 config 有 CONFIG_PINCTRL=y，该行只在 msm-kernel
          #      的 gki_defconfig 里
          #   ② walt_rq 来自 kernel/sched/walt/，该目录只在 msm-kernel 里
          # ───────────────────────────────────────────────────────────────
          SCRIPT="$GITHUB_WORKSPACE/repo/tools/ci_patch_and_config.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::缺少 $SCRIPT（actions/checkout 是否拉到了 tools/？）"
            exit 1
          fi
          bash -n "$SCRIPT" || { echo "::error::ci_patch_and_config.sh 语法错误"; exit 1; }
          bash "$SCRIPT" "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/repo"

      - name: 构建内核（官方入口）
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/src"
          # 官方 README 的构建命令（必须在仓库根目录执行，脚本用的是相对路径）
          echo "=== ./kernel_platform/oplus/build/oplus_build_kernel.sh $PLATFORM $VARIANT ==="
          echo "=== 开始: $(date '+%F %T') ==="

          # 已知现象（源码审计确认，不要"修"）：
          #   1. oplus_setup.sh:12 source 一个不存在的 vendorsetup.sh
          #      —— 脚本无 set -e，只打印报错后继续，不影响构建路径
          #   2. oplus_build_kernel.sh:12 内部是 `prepare_vendor.sh ... | tee log`
          #      且没有 set -o pipefail —— 编译失败时【脚本仍返回 0】！
          #      所以退出码不可信，必须靠产物断言判定成败（见下一步）
          #
          # 为拿到真实退出码，这里不复用 oplus_build_kernel.sh，而是等价展开它：
          #   source oplus_setup.sh <p> <v>   -> 顶层 choose_* 消费参数、设置变量
          #   init_build_environment          -> 导出 TOPDIR/ANDROID_* 等
          #   prepare_vendor.sh sun perf      -> 真正的构建（内部 set -e）
          # 这样 set -e + pipefail 才真正生效。
          mkdir -p LOGDIR
          set -o pipefail
          export TOPDIR="$(pwd)"
          # 修正 JAVA_HOME（oplus_setup.sh 会把它覆盖成不存在的 jdk21 路径；
          # 这里在 setup 之后再纠正为 manifest 实际提供的 jdk11）
          if [ -d kernel_platform/prebuilts/jdk/jdk11 ]; then
            export JAVA_HOME="$(pwd)/kernel_platform/prebuilts/jdk/jdk11"
          fi
          set +e
          # < /dev/null 兜底：即使某分支落到 read ANSWER 也会立刻 EOF 返回，
          # 不会挂住 CI（审计 §7.1）
          source kernel_platform/oplus/build/oplus_setup.sh "$PLATFORM" "$VARIANT" < /dev/null
          init_build_environment
          RC_SETUP=$?
          echo "=== setup 完成 (rc=$RC_SETUP) ==="
          echo "  variants_platform=$variants_platform  variants_type=$variants_type"
          echo "  DIST_INSTALL=$DIST_INSTALL"
          echo "  KERNEL_OUT=$KERNEL_OUT"

          LOG="LOGDIR/build_$(date +%Y_%m_%d_%H_%M_%S).log"
          # 注意：build_with_bazel.py 会在 cwd（kernel_platform）下建 bazel-cache/
          # 并设 TEST_TMPDIR 指向它 —— 输出会落在源码树内，与 sync 的空间叠加。
          echo "=== 编译前磁盘 ==="; df -h / | tail -1

          # ── 关闭 KMI 符号裁剪（--notrim）─────────────────────────────
          # 为什么必须关（三项证据，详见 patches/ci_config_fragment.txt 末尾）：
          #   ① 真机内嵌 config: "# CONFIG_TRIM_UNUSED_KSYMS is not set"
          #   ② run#8 实测：白名单 4998 个符号与真机 495 模块的期望符号
          #      【完全一致】，编译期 0 误裁、CRC 0 冲突，上机仍 bootloop
          #      → 厂商模块还依赖未被 __versions 记录的符号（运行时经
          #        kallsyms 查找），裁掉它们同样致命
          #   ③ 已知能开机的参考内核内嵌 config 同样未启用 TRIM
          #
          # 注意 trim_nonlisted_kmi 在 msm-kernel/BUILD.bazel:153/168 被硬编码
          # 为 True（kernel_aarch64 / kernel_aarch64_16k），所以只改 defconfig
          # 不够，必须传 --notrim 让 kleaf 的 force_disable_trim 生效。
          # 该 flag 已在本树注册：
          #   bazelrc/flags.bazelrc:49
          #     build --flag_alias=notrim=//build/kernel/kleaf/impl:force_disable_trim
          # 且 kernel_config.bzl 的 _config_trim 在 disable 时直接 return []，
          # 不会引入其它副作用。
          #
          # 同时注意 prepare_vendor.sh:255 的条件
          #   ([[ .. ]] && [[ !$(grep -q ..) ]])   ← 缺空格，[[ !<空串> ]] 恒真
          # 会在部分调用路径下追加 -g（= --gki-headers），而 -g 会把 common 树
          # 的 6785 个头文件符号链接覆盖到 msm-kernel 上（含
          # include/linux/sched.h、include/asm-generic/vmlinux.lds.h、
          # include/linux/sched/task.h、include/uapi/linux/sched.h）
          # → 补丁对 sched.h 的修改会被顶掉，walt_rq 的 CRC 永远修不好。
          # run#4 的 build_opts.txt 里没有 -g（说明实际未触发）。
          # 注意：-g/--gki-headers 是 build_with_bazel.py 的 argparse 开关
          # （store_true，默认关），【没有】对应的 --nogki_headers 反向开关，
          # 而且未知参数会被 parse_known_args 原样转交给 bazel 导致构建失败，
          # 所以这里【不能】加 --nogki_headers。
          # 改用补丁步骤里的断言自证：sched.h 必须是普通文件且内容含
          # CONFIG_HMBIRD_SCHED / ANDROID_KABI_USE(6)（见 ci_patch_and_config.sh）。
          export EXTRA_KBUILD_ARGS="--skip abl --notrim"
          echo "=== EXTRA_KBUILD_ARGS=$EXTRA_KBUILD_ARGS ==="

          # 再确认构建命令不会带 -g：显式告知脚本本变体走 msm-kernel 头文件。
          if grep -q 'define_msm_la' kernel_platform/msm-kernel/"$PLATFORM".bzl 2>/dev/null; then
            echo "=== 已确认 //msm-kernel:${PLATFORM}.bzl 含 define_msm_la（-g 不应触发）==="
          else
            echo "::warning::未在 msm-kernel/${PLATFORM}.bzl 找到 define_msm_la —— -g 可能被触发"
          fi

          set -e
          timeout 10800 ./kernel_platform/build/android/prepare_vendor.sh \
            "$PLATFORM" "$VARIANT" < /dev/null 2>&1 | tee "$LOG" | tail -200
          RC=${PIPESTATUS[0]}
          echo "=== 结束: $(date '+%F %T') prepare_vendor 退出码: $RC ==="
          echo "=== 完整日志: $LOG ($(wc -l < "$LOG" 2>/dev/null) 行) ==="
          if [ "$RC" -ne 0 ]; then
            echo "::error::prepare_vendor.sh 失败（退出码 $RC）"
            echo "--- 日志末尾 60 行 ---"
            tail -60 "$LOG" 2>/dev/null || true
            exit 1
          fi

      - name: 产物断言（真正的失败判据）
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/src"
          FAIL=0
          # 审计确认的产物路径（$1=sun, $2=perf）
          DIST="kernel_platform/out/msm-kernel-${PLATFORM}-${VARIANT}/dist"
          KOUT="device/qcom/${PLATFORM}-kernel"
          echo "=== 断言 DIST_INSTALL: $DIST ==="
          if [ -d "$DIST" ]; then
            ls -lh "$DIST" | head -30
            # 关键产物：Image 必须有内容
            if [ -s "$DIST/Image" ]; then
              echo "  [OK] $DIST/Image ($(stat -c %s "$DIST/Image") 字节)"
            else
              echo "  [FAIL] $DIST/Image 缺失或为空"; FAIL=1
            fi
          else
            echo "  [FAIL] DIST_INSTALL 目录不存在"; FAIL=1
          fi
          echo "=== 断言 KERNEL_OUT: $KOUT ==="
          if [ -d "$KOUT" ]; then
            ls -lh "$KOUT" | head -25
          else
            echo "  [WARN] KERNEL_OUT 目录不存在（可能非必经路径）"
          fi
          echo "=== 模块产物 ==="
          find "$DIST" -name "*.ko" 2>/dev/null | head -20
          echo "  dist 下 .ko 总数: $(find "$DIST" -name '*.ko' 2>/dev/null | wc -l)"

          # ─────────────────────────────────────────────────────────
          # 充电驱动 oplus_chg_v2.ko 的归属（源码审计确认）：
          #   既不在 modules.list.msm.sun（first-stage）
          #   也不在 modules.vendor_boot.list.oplus（仅 2 个文件）
          #   → 按 prepare_vendor.sh:414-428 分流到 vendor_dlkm
          # 含义：只刷 boot.img 修不了充电，必须同时刷 vendor_dlkm.img
          # ─────────────────────────────────────────────────────────
          echo "=== 充电驱动归属检查（关键）==="
          CHG=$(find "$DIST" "$KOUT" kernel_platform/oplus/prebuild -name 'oplus_chg_v2.ko' 2>/dev/null | head -1)
          if [ -n "$CHG" ]; then
            echo "  [OK] 找到 oplus_chg_v2.ko: $CHG"
          else
            echo "  [FAIL] 未找到 oplus_chg_v2.ko —— 充电驱动仍未参与编译！"
            echo "         （说明 vendor/oplus 符号链接链未通，或 CONFIG_OPLUS_CHG_V2 未生效）"
            FAIL=1
          fi
          echo "  vendor_dlkm 相关产物:"
          find "$DIST" "$KOUT" -iname "*vendor_dlkm*" 2>/dev/null | head -10
          echo "  （注意：vendor_dlkm.img 需与 boot.img 一起刷，否则充电驱动不生效）"

          # 模块符号链接链自检（诊断用，帮助定位断链）
          echo "=== 厂商驱动符号链接链自检 ==="
          for sl in drivers/power/oplus drivers/soc/oplus/boot drivers/android/oplus_binder; do
            p="kernel_platform/msm-kernel/$sl"
            if [ -L "$p" ]; then
              if [ -e "$p" ]; then echo "  [OK]   $sl -> $(readlink $p)"
              else echo "  [FAIL] $sl 断链 -> $(readlink $p)"; FAIL=1; fi
            else
              echo "  [WARN] $p 不是符号链接或不存在"
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::构建产物断言失败 —— 编译实际未成功"
            exit 1
          fi
          echo "产物断言通过 ✅"

      - name: 产物验证（四项验收闸门，全部在 CI 内完成）
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/src" || exit 0
          DIST="kernel_platform/out/msm-kernel-${PLATFORM}-${VARIANT}/dist"
          if [ ! -d "$DIST" ]; then
            echo "::error::dist 目录不存在（构建未产出）: $DIST"
            exit 1
          fi
          # 所有断言逻辑在仓库脚本里（避免 YAML 转义地狱）
          # 注意：build_opts.txt 是判断 -g/--gki-headers 是否真的生效的铁证
          #       （-g 会覆盖 sched.h，让 walt_rq 的 CRC 永远修不好）
          echo "=== build_opts.txt（铁证：确认没有 -g / --gki-headers）==="
          cat "$DIST/build_opts.txt" 2>/dev/null || echo "  [WARN] 无 build_opts.txt"
          if grep -qE '(^| )-g$|--gki-headers' "$DIST/build_opts.txt" 2>/dev/null; then
            echo "::error::构建带了 -g/--gki-headers —— common 头文件会覆盖 msm-kernel，补丁失效"
            exit 1
          fi
          echo "  [OK] build_opts.txt 中无 -g / --gki-headers"
          echo
          # ── TRIM 硬断言（run#8 实测死因，必须显式确认未启用）──────────
          # 白名单 android/abi_gki_aarch64_qcom 只有 2468 个符号，而厂商模块
          # 需要 4998 个；被裁的正是白名单外那 687 个。__versions 只记录编译期
          # 引用，运行时经 kallsyms 查找的符号根本不进白名单 → 编译期查不出、
          # 上机 bootloop。真机内嵌 config 也是 not set。
          echo "=== .config 的 TRIM 状态（必须未启用）==="
          CFG_P="$GITHUB_WORKSPACE/src/device/qcom/${PLATFORM}-kernel/.config"
          if [ ! -f "$CFG_P" ]; then
            CFG_P="$DIST/.config"
          fi
          echo "  检查文件: $CFG_P"
          if [ -f "$CFG_P" ]; then
            grep -n 'TRIM_UNUSED_KSYMS\|UNUSED_KSYMS_WHITELIST' "$CFG_P" || echo "  (无 TRIM 相关行)"
            if grep -q '^CONFIG_TRIM_UNUSED_KSYMS=y' "$CFG_P"; then
              echo "::error::CONFIG_TRIM_UNUSED_KSYMS=y —— 会裁掉厂商模块运行时依赖的符号"
              echo "::error::（run#8 实测：编译期 0 误裁 / CRC 0 冲突，上机仍 bootloop）"
              exit 1
            fi
            echo "  [OK] CONFIG_TRIM_UNUSED_KSYMS 未启用（--notrim 生效）"
          else
            echo "  [WARN] 找不到 .config；TRIM 状态由 ci_verify.py 的内嵌 config 断言覆盖"
          fi
          echo
          python3 "$GITHUB_WORKSPACE/repo/tools/ci_verify.py" \
            --dist "$DIST" \
            --repo-root "$GITHUB_WORKSPACE/repo" \
            --expected "$GITHUB_WORKSPACE/repo/expected_crc.txt" \
            --crc-gate "$GITHUB_WORKSPACE/repo/tools/crc_gate.py" \
            --allow clk_alpha_pll_regs
          RC=$?
          echo "=== ci_verify.py 退出码: $RC ==="
          exit $RC

      - name: 收集产物
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/src" 2>/dev/null || exit 0
          echo "=== 搜索本次构建产物 ==="
          for d in \
            "kernel_platform/out/msm-kernel-${PLATFORM}-${VARIANT}/dist" \
            "device/qcom/${PLATFORM}-kernel" \
            "kernel_platform/oplus/prebuild/out" \
            "kernel_platform/bazel-bin/msm-kernel/${PLATFORM}_${VARIANT}" \
          ; do
            if [ -d "$d" ]; then
              echo "--- $d"
              ls -lh "$d" 2>/dev/null | head -25
            fi
          done
          echo
          echo "=== 全局搜 Image / *.img（近 3 小时）==="
          find . -maxdepth 8 \( -name "Image" -o -name "boot.img" -o -name "*.img" \) \
            -newermt "-3 hours" 2>/dev/null | head -30

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ace5Pro-Bazel-${{ inputs.variant }}
          path: |
            src/kernel_platform/out/**/dist/**
            src/device/qcom/**-kernel/**
            src/kernel_platform/oplus/prebuild/out/**
            src/kernel_platform/oplus/prebuild/*_tmp/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────
      # 单独上传【小体积】复核文件（Module.symvers 约 728 KB + build_opts.txt），
      # 便于需要时在本地复核 CRC 而【不必】下载上面 985 MB 的整包
      # （用户明确投诉过带宽占用）。
      # ─────────────────────────────────────────────────────────────────
      - name: 上传关键小文件（Module.symvers 等，便于本地复核 CRC）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ace5Pro-keyfiles-${{ inputs.variant }}
          path: |
            src/kernel_platform/out/msm-kernel-${{ env.PLATFORM }}-${{ inputs.variant }}/dist/Module.symvers
            src/kernel_platform/out/msm-kernel-${{ env.PLATFORM }}-${{ inputs.variant }}/dist/build_opts.txt
            src/device/qcom/${{ env.PLATFORM }}-kernel/Module.symvers
            src/device/qcom/${{ env.PLATFORM }}-kernel/build_opts.txt
            src/LOGDIR/build_*.log
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7
