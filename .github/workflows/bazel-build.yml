name: Build Ace5Pro Bazel/kleaf (官方 repo 流程)

# ─────────────────────────────────────────────────────────────────────────
# 官方构建方式（来自 OnePlusOSS/kernel_manifest 分支 oneplus/sm8750 的 README）:
#
#     ./kernel_platform/oplus/build/oplus_build_kernel.sh sun perf
#
# 依赖 33 个仓库（3 个 OnePlusOSS + 30 个 CodeLinaro），由 repo 工具按
# manifest 文件 oneplus_ace5_pro.xml 拉取。
#
# 为什么不能用纯 make：
#   厂商驱动（充电/传感器/设备树，含 848 个充电驱动文件）在
#   android_kernel_modules_and_devicetree_oneplus_sm8750 仓库里，
#   且必须在 kernel_platform 工作区内经 bazel(kleaf) 构建。
#   只克隆 common 仓库用 make 编出的内核缺这些驱动，充电时主电源轨
#   XVDD/DVDD 掉电导致 PMIC 复位（实测 critical.log LOGTYPE=601）。
#
# 平台/variant 取值（源码审计确认）：
#   $1 platform : sun        （sm8750 的高通代号；oplus_setup.sh 里只认 sun）
#   $2 variant  : perf       （=user；consolidate=userdebug）
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        type: choice
        options: ['perf', 'consolidate']
        default: 'perf'
      repo_jobs:
        description: 'repo 并发数（过高易被限流）'
        type: string
        default: '4'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MANIFEST_URL: https://github.com/OnePlusOSS/kernel_manifest
      MANIFEST_BRANCH: oneplus/sm8750
      MANIFEST_FILE: oneplus_ace5_pro.xml
      PLATFORM: sun
      VARIANT: ${{ inputs.variant }}
      REPO_JOBS: ${{ inputs.repo_jobs }}

    steps:
      - name: 清理磁盘 + 显示资源
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache /usr/local/lib/node_modules \
            /opt/az /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo apt-get clean
          echo "=== 磁盘 ==="; df -h /
          echo "=== 内存 ==="; free -h
          echo "=== CPU ==="; nproc

      - name: 设置 SWAP（Bazel 链接阶段内存峰值很高）
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l 16G /swapfile 2>/dev/null; then
            sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show; free -h
          SW=$(free -m | awk '/^Swap:/{print $2}')
          if [ "${SW:-0}" -lt 1000 ]; then echo "::error::swap 未生效"; exit 1; fi

      - name: 安装依赖（含 repo 工具）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev python3 cpio dwarves \
            zip unzip curl git patch rsync build-essential \
            openjdk-17-jdk-headless 2>&1 | tail -3
          echo "=== git / java ==="
          git --version
          java -version 2>&1 | head -2

          echo "=== 安装 repo ==="
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo" \
          || curl -fsSL --retry 3 \
            https://github.com/GerritCodeReview/git-repo/raw/main/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: repo init（官方 manifest）
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"
          git config --global user.name  "CI"
          git config --global user.email "ci@example.com"
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

          echo "=== repo init -b $MANIFEST_BRANCH -m $MANIFEST_FILE ==="
          repo init \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            -m "$MANIFEST_FILE" \
            --no-clone-bundle --no-tags
          echo "=== manifest 已拉取，项目数: ==="
          ls .repo/manifests/ | head
          grep -c "<project" .repo/manifests/$MANIFEST_FILE

      - name: repo sync（33 个仓库，约 5-15 GB，耗时较长）
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/src"
          # 先试带 --depth=1（省体积），失败则退回不带 depth 的完整 sync
          # 背景：实测 CodeLinaro 支持 `git fetch --depth=1 origin <sha>`，
          #       但 repo 不同版本对 --depth + SHA revision 的处理可能不同，
          #       因此保留 fallback，避免因参数不兼容而整轮失败。
          sync_try() {
            echo "=== repo sync $* ==="
            timeout 5400 repo sync -c -j"$REPO_JOBS" --no-tags --force-sync \
              --no-clone-bundle "$@" 2>&1 | tail -60
            return ${PIPESTATUS[0]}
          }

          if sync_try --depth=1; then
            echo "=== repo sync（带 --depth=1）成功 ==="
          else
            echo "::warning::带 --depth=1 的 sync 失败，退回完整 sync（更慢、更占空间）"
            sync_try || { echo "::error::repo sync 失败"; exit 1; }
          fi

          echo "=== 磁盘 ==="; df -h / | tail -1
          echo "=== 顶层内容 ==="; ls -la | head -20

      - name: 校验工作区完整性（缺一个就编不出可用内核）
        run: |
          cd "$GITHUB_WORKSPACE/src"
          FAIL=0
          check() {
            if [ -e "$1" ]; then echo "  [OK]   $1"; else echo "  [FAIL] $1"; FAIL=1; fi
          }
          echo "=== 3 个 OnePlusOSS 仓库 ==="
          check kernel_platform/common/Makefile
          check kernel_platform/msm-kernel/BUILD.bazel
          check vendor/oplus/kernel/charger/Makefile
          check kernel_platform/oplus/build/oplus_build_kernel.sh
          echo "=== linkfile（manifest 声明，repo 会自动建）==="
          check kernel_platform/.source_date_epoch_dir
          check kernel_platform/build_with_bazel.py
          check kernel_platform/build/prebuilts/build-tools
          echo "=== 关键 prebuilts ==="
          check kernel_platform/prebuilts/build-tools
          check kernel_platform/prebuilts/clang-tools
          check kernel_platform/prebuilts/jdk/jdk11
          check kernel_platform/tools/mkbootimg
          check kernel_platform/build/kernel/kleaf
          echo "=== 厂商驱动规模（应 >800 个 .c）==="
          echo "  charger .c 文件数: $(find vendor/oplus/kernel/charger -name '*.c' 2>/dev/null | wc -l)"
          echo "  设备树文件数:      $(find kernel_platform/qcom/opensource/devicetree -name '*.dts*' 2>/dev/null | wc -l)"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::工作区不完整，中止以免编出半成品"
            exit 1
          fi
          echo "工作区校验通过 ✅"

      - name: 构建内核（官方入口）
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/src"
          # 官方 README 的构建命令（必须在仓库根目录执行，脚本用的是相对路径）
          echo "=== ./kernel_platform/oplus/build/oplus_build_kernel.sh $PLATFORM $VARIANT ==="
          echo "=== 开始: $(date '+%F %T') ==="

          # 注意 oplus_setup.sh 第 12 行会 source 一个不存在的 vendorsetup.sh，
          # 脚本无 set -e，会打印报错后继续，属已知现象，不要给它造假文件。
          timeout 10800 bash kernel_platform/oplus/build/oplus_build_kernel.sh \
            "$PLATFORM" "$VARIANT" 2>&1 | tail -200
          RC=${PIPESTATUS[0]}
          echo "=== 结束: $(date '+%F %T') 退出码: $RC ==="
          if [ "$RC" -ne 0 ]; then
            echo "::error::构建失败（退出码 $RC）"
            exit 1
          fi

      - name: 收集产物
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/src" 2>/dev/null || exit 0
          echo "=== 搜索本次构建产物 ==="
          for d in \
            "kernel_platform/out/msm-kernel-${PLATFORM}-${VARIANT}/dist" \
            "device/qcom/${PLATFORM}-kernel" \
            "kernel_platform/oplus/prebuild/out" \
            "kernel_platform/bazel-bin/msm-kernel/${PLATFORM}_${VARIANT}" \
          ; do
            if [ -d "$d" ]; then
              echo "--- $d"
              ls -lh "$d" 2>/dev/null | head -25
            fi
          done
          echo
          echo "=== 全局搜 Image / *.img（近 3 小时）==="
          find . -maxdepth 8 \( -name "Image" -o -name "boot.img" -o -name "*.img" \) \
            -newermt "-3 hours" 2>/dev/null | head -30

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ace5Pro-Bazel-${{ inputs.variant }}
          path: |
            src/kernel_platform/out/**/dist/**
            src/device/qcom/**-kernel/**
            src/kernel_platform/oplus/prebuild/out/**
            src/kernel_platform/oplus/prebuild/*_tmp/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
