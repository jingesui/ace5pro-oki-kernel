      - name: '[CRC 把关] 与厂商模块期望值比对'
        run: |
          cd common
          echo "=== 生成 Module.symvers ==="
          make -j"$(nproc)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-Wno-error modules_prepare 2>/dev/null || true
          SYMVERS="$(pwd)/out/Module.symvers"
          if [ ! -f "$SYMVERS" ]; then
            echo "::error::未生成 Module.symvers，无法做 CRC 把关"
            exit 1
          fi
          echo "Module.symvers 行数: $(wc -l < "$SYMVERS")"
          cd "$GITHUB_WORKSPACE"
          python3 tools/crc_gate.py "$SYMVERS" expected_crc.txt
