name: Build Ace5Pro OKI Kernel 6.6.66

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 清理磁盘 + 显示资源
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          echo "=== 清理后磁盘 ==="; df -h /
          echo "=== 内存 ==="; free -h
          echo "=== CPU ==="; nproc

      # ─────────────────────────────────────────────────────────
      # SWAP：内核编译峰值内存很高，私有仓库 runner 内存偏小。
      # 不加 swap 会在链接阶段被 OOM Killer 杀掉（表现为突然失败）。
      # ─────────────────────────────────────────────────────────
      - name: 设置 SWAP
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          echo "=== 尝试 fallocate 分配 8G ==="
          if ! sudo fallocate -l 8G /swapfile 2>/dev/null; then
            echo "fallocate 失败，改用 dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== SWAP 状态 ==="
          swapon --show
          free -h
          echo "=== 确认 swap 可用（应为非 0）==="
          SWAP_TOTAL=$(free -m | awk '/^Swap:/{print $2}')
          echo "Swap 总量: ${SWAP_TOTAL} MB"
          if [ "${SWAP_TOTAL:-0}" -lt 1000 ]; then
            echo "::error::swap 未生效，中止以免编译后期 OOM"
            exit 1
          fi

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev python3 cpio dwarves \
            zip unzip curl git patch

      - name: 下载 AOSP Clang r510928 (x86_64)
        run: |
          curl -L --retry 3 -o /tmp/clang.tar.gz \
            https://github.com/s1lently/llvm-project/releases/download/r510928-arm64/aosp-clang-r510928-x86_64-kernel.tar.gz
          mkdir -p "$HOME/clang"
          tar xzf /tmp/clang.tar.gz -C /tmp
          if [ -d /tmp/clang-kernel-only ]; then
            mv /tmp/clang-kernel-only/* "$HOME/clang/"
          fi
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -3
          rm -f /tmp/clang.tar.gz

      - name: 克隆官方 OKI 源码 (Ace 5 Pro / OOS15 / 6.6.66)
        run: |
          git clone --depth=1 -b oneplus/sm8750_v_15.0.0_oneplus_ace5_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750 common
          echo "=== 内核版本（应为 6.6.66）==="
          sed -n '1,4p' common/Makefile
          echo "=== 调度器（应为 SLIM_SCHED + SCHED_CLASS_EXT）==="
          grep -nE "SLIM_SCHED|SCHED_CLASS_EXT|HMBIRD" common/arch/arm64/configs/gki_defconfig
          echo "=== 确认无 hmbird ==="
          ls common/kernel/sched/ | grep -i hmbird && { echo "::error::出现 hmbird"; exit 1; } || echo "  hmbird: 不存在（正确）"
          rm -f common/android/abi_gki_protected_exports_*
          sed -i 's/ -dirty//g' common/scripts/setlocalversion

      - name: '[Droidspaces] 打 kABI 补丁 (SYSVIPC padding)'
        run: |
          cd common
          curl -sSL --retry 3 -o /tmp/sysvipc_kabi.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          echo "补丁: $(wc -c < /tmp/sysvipc_kabi.patch) 字节"
          echo "=== dry-run ==="
          patch -p1 --dry-run < /tmp/sysvipc_kabi.patch
          echo "=== 正式应用（不给 || true，失败即中止）==="
          patch -p1 < /tmp/sysvipc_kabi.patch
          echo "=== 核对字段已进 KABI 槽 ==="
          grep -n "ANDROID_KABI_USE(6" include/linux/sched.h || { echo "::error::kABI 补丁未生效"; exit 1; }
          grep -n "ANDROID_KABI_REPLACE" include/linux/sched.h | head -2

      - name: '[Droidspaces] 开启所需配置项'
        run: |
          cd common
          D=arch/arm64/configs/gki_defconfig
          for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS \
                   NETFILTER_XT_MATCH_ADDRTYPE USER_NS \
                   IP6_NF_NAT IP6_NF_TARGET_MASQUERADE MACVLAN \
                   NETFILTER_XT_TARGET_REJECT NETFILTER_XT_TARGET_LOG \
                   NETFILTER_XT_MATCH_RECENT \
                   IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET \
                   TMPFS_POSIX_ACL TMPFS_XATTR; do
            if grep -qE "^CONFIG_${c}=y" "$D"; then
              echo "  已开: $c"
            elif grep -qE "^# CONFIG_${c} is not set" "$D"; then
              sed -i "s|^# CONFIG_${c} is not set|CONFIG_${c}=y|" "$D"
              echo "  改为 y: $c"
            else
              echo "CONFIG_${c}=y" >> "$D"
              echo "  追加: $c"
            fi
          done

      - name: '[ADIOS] 打补丁并设为默认调度器'
        run: |
          cd common
          curl -sSL --retry 3 -o /tmp/adios.patch \
            https://raw.githubusercontent.com/qdykernel/Build_Oneplus_Realme_Action/main/patch/adios_ioscheduler_6.6.patch
          echo "补丁: $(wc -c < /tmp/adios.patch) 字节"
          echo "=== dry-run ==="
          patch -p1 --dry-run < /tmp/adios.patch
          echo "=== 正式应用（不给 || true，失败即中止）==="
          patch -p1 < /tmp/adios.patch
          echo "=== 核对 ==="
          grep -n "MQ_IOSCHED_ADIOS" block/Kconfig.iosched | head -2 || { echo "::error::ADIOS Kconfig 未生效"; exit 1; }
          grep -q "adios" block/Makefile || { echo "::error::ADIOS 未进 Makefile"; exit 1; }
          ls -l block/adios.c
          D=arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> "$D"
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> "$D"

      - name: 生成配置
        run: |
          cd common
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> arch/arm64/configs/gki_defconfig
          make -j"$(nproc)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld HOSTLD=ld.lld O=out \
            KCFLAGS+=-Wno-error gki_defconfig

      - name: 严格校验最终配置
        run: |
          cd common
          FAIL=0
          echo "=== 必须为 y 的项 ==="
          for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS USER_NS MACVLAN \
                   MQ_IOSCHED_ADIOS MQ_IOSCHED_DEFAULT_ADIOS \
                   SLIM_SCHED SCHED_CLASS_EXT MODVERSIONS; do
            if grep -qE "^CONFIG_${c}=y" out/.config; then
              echo "  [OK]   $c"
            else
              echo "  [FAIL] $c  -> $(grep -E "CONFIG_${c}[= ]" out/.config || echo '缺失')"
              FAIL=1
            fi
          done
          echo "=== 必须不是 y 的项 ==="
          for c in HMBIRD_SCHED KSU KSU_SUSFS CFS_BANDWIDTH CGROUP_PIDS; do
            if grep -qE "^CONFIG_${c}=y" out/.config; then
              echo "  [FAIL] $c 不应开启"
              FAIL=1
            else
              echo "  [OK]   $c 未开启"
            fi
          done
          echo "=== ABI 关键项 ==="
          grep -E "^CONFIG_MODULE_SIG_PROTECT|^CONFIG_MODULE_SCMVERSION|^CONFIG_MODULE_SIG=|^CONFIG_TRIM_UNUSED_KSYMS" out/.config || true
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::配置校验未通过，中止编译以免产出半成品内核"
            exit 1
          fi
          echo "配置校验全部通过 ✅"

      - name: 编译 Image（带 OOM 保护）
        run: |
          cd common
          set -o pipefail
          # 编译前再确认 swap 在线
          swapon --show
          free -h
          /usr/bin/time -v make -j"$(nproc)" LLVM=1 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld HOSTLD=ld.lld O=out \
            KCFLAGS+=-Wno-error Image 2>&1 | tail -40
          ls -l out/arch/arm64/boot/Image
          echo "=== 内核版本串 ==="
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"
          echo "=== ADIOS 编入验证 ==="
          strings out/arch/arm64/boot/Image | grep -ci adios || true

      - name: 打包 AnyKernel3
        run: |
          git clone --depth=1 -b master https://github.com/cctv18/AnyKernel3 ak3
          cp common/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          sed -i 's/^BLOCK=.*/BLOCK=boot/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto/' anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=Ace5Pro OKI 6.6.66 (official src + droidspaces + adios)/' anykernel.sh
          grep -E "^BLOCK=|^IS_SLOT_DEVICE=|^kernel.string=" anykernel.sh
          rm -rf .git
          zip -r9 ../AK3_Ace5Pro_OKI_6.6.66.zip . > /dev/null
          cd ..
          ls -lh AK3_Ace5Pro_OKI_6.6.66.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Ace5Pro-OKI-6.6.66
          compression-level: 9
          path: |
            common/out/arch/arm64/boot/Image
            AK3_Ace5Pro_OKI_6.6.66.zip
            common/out/.config
