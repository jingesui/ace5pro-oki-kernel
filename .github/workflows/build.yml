name: Build Ace5Pro OKI Kernel 6.6.66

on:
  workflow_dispatch:
    inputs:
      enable_fengchi:
        description: '启用原厂风驰调度器 (hmbird) —— 必须开，否则 Bootloop'
        type: boolean
        default: true
      enable_droidspaces:
        description: '启用 Droidspaces 支持'
        type: boolean
        default: true
      enable_adios:
        description: '启用 ADIOS IO 调度器'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 清理磁盘 + 显示资源
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          echo "=== 磁盘 ==="; df -h /
          echo "=== 内存 ==="; free -h
          echo "=== CPU ==="; nproc

      - name: 设置 SWAP（内存不足会导致链接阶段被 OOM 杀掉）
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l 8G /swapfile 2>/dev/null; then
            echo "fallocate 失败，改用 dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          free -h
          SWAP_TOTAL=$(free -m | awk '/^Swap:/{print $2}')
          echo "Swap: ${SWAP_TOTAL} MB"
          if [ "${SWAP_TOTAL:-0}" -lt 1000 ]; then
            echo "::error::swap 未生效，中止以免编译后期 OOM"
            exit 1
          fi

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev python3 cpio dwarves \
            zip unzip curl git patch

      - name: 下载 AOSP Clang r510928 (x86_64)
        run: |
          curl -L --retry 3 -o /tmp/clang.tar.gz \
            https://github.com/s1lently/llvm-project/releases/download/r510928-arm64/aosp-clang-r510928-x86_64-kernel.tar.gz
          mkdir -p "$HOME/clang"
          tar xzf /tmp/clang.tar.gz -C /tmp
          if [ -d /tmp/clang-kernel-only ]; then
            mv /tmp/clang-kernel-only/* "$HOME/clang/"
          fi
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -3
          rm -f /tmp/clang.tar.gz

      - name: 克隆官方 OKI 源码
        run: |
          git clone --depth=1 -b oneplus/sm8750_v_15.0.0_oneplus_ace5_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750 common
          echo "=== 内核版本（应为 6.6.66）==="
          sed -n '1,4p' common/Makefile
          echo "=== 当前调度器（应为 SLIM_SCHED，待风驰补丁替换）==="
          grep -nE "SLIM_SCHED|SCHED_CLASS_EXT|HMBIRD" common/arch/arm64/configs/gki_defconfig
          rm -f common/android/abi_gki_protected_exports_*
          sed -i 's/ -dirty//g' common/scripts/setlocalversion

      # ─────────────────────────────────────────────────────────
      # 风驰调度器：原厂 /proc/config.gz 实测 CONFIG_HMBIRD_SCHED=y。
      # 开源 defconfig 却是 SLIM_SCHED —— 调度器不同 => task_struct 布局不同
      # => 符号 CRC 全变 => 厂商模块拒绝加载 => bootloop。
      # 此补丁为 Ace 5 Pro 专用，内部会把 SLIM_SCHED+CLASS_EXT 换成 HMBIRD_SCHED。
      # ─────────────────────────────────────────────────────────
      - name: '[风驰] 打机型专用补丁'
        if: inputs.enable_fengchi
        run: |
          cd common
          curl -sSL --retry 3 -o /tmp/fengchi.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/oneplus/hmbird/fengchi_OP-ACE-5-PRO_A15.patch
          echo "补丁: $(wc -c < /tmp/fengchi.patch) 字节, $(wc -l < /tmp/fengchi.patch) 行"

          echo "=== 应用（失败即中止，不给 || true）==="
          patch -p1 --no-backup-if-mismatch < /tmp/fengchi.patch

          echo "=== 核对 ==="
          test -f kernel/sched/hmbird/hmbird.c || { echo "::error::hmbird.c 未生成"; exit 1; }
          echo "  hmbird.c: $(wc -l < kernel/sched/hmbird/hmbird.c) 行"
          ls kernel/sched/hmbird/
          grep -q "CONFIG_HMBIRD_SCHED=y" arch/arm64/configs/gki_defconfig \
            && echo "  ✅ defconfig 已切换为 HMBIRD_SCHED" \
            || { echo "::error::defconfig 未切换到 HMBIRD_SCHED"; exit 1; }
          grep -q "sched_ext" kernel/sched/Makefile && echo "  注意: Makefile 仍含 sched_ext" || echo "  ✅ sched_ext 已移除"

      - name: '[Droidspaces] 打 kABI 补丁 (SYSVIPC padding)'
        if: inputs.enable_droidspaces
        run: |
          cd common
          curl -sSL --retry 3 -o /tmp/sysvipc_kabi.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          echo "补丁: $(wc -c < /tmp/sysvipc_kabi.patch) 字节"
          patch -p1 --dry-run < /tmp/sysvipc_kabi.patch
          patch -p1 < /tmp/sysvipc_kabi.patch
          grep -n "ANDROID_KABI_USE(6" include/linux/sched.h || { echo "::error::kABI 补丁未生效"; exit 1; }
          echo "  ✅ SYSVIPC 字段已挪入 ABI padding 槽 6/7/8"

      - name: '[Droidspaces] 开启配置项'
        if: inputs.enable_droidspaces
        run: |
          cd common
          D=arch/arm64/configs/gki_defconfig
          for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS \
                   NETFILTER_XT_MATCH_ADDRTYPE USER_NS \
                   IP6_NF_NAT IP6_NF_TARGET_MASQUERADE MACVLAN \
                   NETFILTER_XT_TARGET_REJECT NETFILTER_XT_TARGET_LOG \
                   NETFILTER_XT_MATCH_RECENT \
                   IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET \
                   TMPFS_POSIX_ACL TMPFS_XATTR; do
            if grep -qE "^CONFIG_${c}=y" "$D"; then
              echo "  已开: $c"
            elif grep -qE "^# CONFIG_${c} is not set" "$D"; then
              sed -i "s|^# CONFIG_${c} is not set|CONFIG_${c}=y|" "$D"
              echo "  改为 y: $c"
            else
              echo "CONFIG_${c}=y" >> "$D"
              echo "  追加: $c"
            fi
          done

      - name: '[ADIOS] 打补丁并设为默认调度器'
        if: inputs.enable_adios
        run: |
          cd common
          curl -sSL --retry 3 -o /tmp/adios.patch \
            https://raw.githubusercontent.com/qdykernel/Build_Oneplus_Realme_Action/main/patch/adios_ioscheduler_6.6.patch
          echo "补丁: $(wc -c < /tmp/adios.patch) 字节"
          patch -p1 --dry-run < /tmp/adios.patch
          patch -p1 < /tmp/adios.patch
          grep -q "MQ_IOSCHED_ADIOS" block/Kconfig.iosched || { echo "::error::ADIOS Kconfig 未生效"; exit 1; }
          grep -q "adios" block/Makefile || { echo "::error::ADIOS 未进 Makefile"; exit 1; }
          ls -l block/adios.c
          D=arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> "$D"
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> "$D"

      - name: 生成配置
        run: |
          cd common
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> arch/arm64/configs/gki_defconfig
          make -j"$(nproc)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld HOSTLD=ld.lld O=out \
            KCFLAGS+=-Wno-error gki_defconfig

      - name: 严格校验最终配置
        run: |
          cd common
          FAIL=0
          echo "=== 必须为 y（对齐原厂）==="
          for c in HMBIRD_SCHED MODVERSIONS; do
            if grep -qE "^CONFIG_${c}=y" out/.config; then
              echo "  [OK]   $c"
            else
              echo "  [FAIL] $c -> $(grep -E "CONFIG_${c}[= ]" out/.config || echo 缺失)"; FAIL=1
            fi
          done
          echo "=== 必须不是 y（会导致 bootloop 或非预期）==="
          for c in SLIM_SCHED SCHED_CLASS_EXT KSU KSU_SUSFS CFS_BANDWIDTH CGROUP_PIDS; do
            if grep -qE "^CONFIG_${c}=y" out/.config; then
              echo "  [FAIL] $c 不应开启"; FAIL=1
            else
              echo "  [OK]   $c 未开启"
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::配置校验未通过"; exit 1
          fi
          echo "核心配置校验通过 ✅"

      - name: 编译 Image
        run: |
          cd common
          swapon --show || true
          free -h
          time make -j"$(nproc)" LLVM=1 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld HOSTLD=ld.lld O=out \
            KCFLAGS+=-Wno-error Image
          ls -l out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: 生成 Module.symvers
        run: |
          cd common
          if [ -f out/Module.symvers ]; then
            echo "Image 编译已生成 Module.symvers: $(wc -l < out/Module.symvers) 行"
          else
            echo "未生成，执行 make modules"
            make -j"$(nproc)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              CC=clang LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-Wno-error modules
            ls -l out/Module.symvers
          fi

      # ─────────────────────────────────────────────────────────
      # CRC 把关：模块能否加载由符号 CRC 决定，而 CRC 是源码+配置经
      # genksyms 算出的，与编译环境无关。全中即可确定能开机，无需试错。
      # ─────────────────────────────────────────────────────────
      - name: 取出仓库脚本（crc_gate.py 等）
        uses: actions/checkout@v4
        with:
          path: repo

      - name: '[CRC 把关] 与厂商模块期望值比对'
        run: |
          cd common
          SYMVERS="$(pwd)/out/Module.symvers"
          test -f "$SYMVERS" || { echo "::error::无 Module.symvers"; exit 1; }
          echo "Module.symvers: $(wc -l < "$SYMVERS") 行"
          test -f "$GITHUB_WORKSPACE/repo/tools/crc_gate.py" || { echo "::error::crc_gate.py 未 checkout"; exit 1; }
          python3 "$GITHUB_WORKSPACE/repo/tools/crc_gate.py" "$SYMVERS" "$GITHUB_WORKSPACE/repo/expected_crc.txt"

      - name: 打包 AnyKernel3
        run: |
          git clone --depth=1 -b master https://github.com/cctv18/AnyKernel3 ak3
          cp common/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          sed -i 's/^BLOCK=.*/BLOCK=boot/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto/' anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=Ace5Pro OKI 6.6.66 (fengchi+droidspaces+adios)/' anykernel.sh
          sed -i 's|^ui_print "内核构建者:.*|ui_print "内核构建者: jingesui"|' anykernel.sh
          grep -E "^BLOCK=|^IS_SLOT_DEVICE=|^kernel.string=" anykernel.sh
          rm -rf .git
          zip -r9 ../AK3_Ace5Pro_OKI_6.6.66.zip . > /dev/null
          cd ..
          ls -lh AK3_Ace5Pro_OKI_6.6.66.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Ace5Pro-OKI-6.6.66-fengchi
          compression-level: 9
          path: |
            common/out/arch/arm64/boot/Image
            AK3_Ace5Pro_OKI_6.6.66.zip
            common/out/.config
            common/out/Module.symvers
